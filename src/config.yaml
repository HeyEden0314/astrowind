site:
  name: AI 中文情报站
  site: 'https://ai-intelligence.pages.dev'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: AI 中文情报站
    template: '%s — AI 中文情报站'
  description: '官方精选，AI 整理，帮你从海量信息中过滤噪音。聚合 OpenAI、Anthropic、Cursor、xAI 等博客，自动翻译摘要。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: AI 中文情报站
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: null
    site: null
    cardType: summary_large_image

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
